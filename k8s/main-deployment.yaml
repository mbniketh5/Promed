apiVersion: apps/v1
kind: Deployment

metadata:
  name: promed-main

spec:
  replicas: 2

  selector:
    matchLabels:
      app: promed-main

  template:
    metadata:
      labels:
        app: promed-main

    spec:
      containers:
      - name: promed-main

        image: i-0e70d648266a8b8b9.dkr.ecr.ap-southeast-2.amazonaws.com/promed-main:v1

        ports:
        - containerPort: 80
