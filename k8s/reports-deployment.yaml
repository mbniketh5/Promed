apiVersion: apps/v1
kind: Deployment

metadata:
  name: reports

spec:
  replicas: 2

  selector:
    matchLabels:
      app: reports

  template:
    metadata:
      labels:
        app: reports

    spec:
      containers:
      - name: reports

        image: i-0e70d648266a8b8b9.dkr.ecr.ap-southeast-2.amazonaws.com/reports:v1

        ports:
        - containerPort: 80
